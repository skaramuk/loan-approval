[project]
name = "loan-ml"
version = "0.1.0"
description = "Data analysis and model training for the Loan Approval project"
requires-python = ">=3.13,<3.14"
dependencies = [
    "joblib>=1.6.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "optuna>=5.0.0",
    "pandas>=3.1.1",
    # Pinned exactly: joblib artifacts require identical versions in ml/ and backend/.
    "scikit-learn==1.9.1",
    "seaborn>=0.13.2",
    "shap>=0.54.1",
    "xgboost==3.4.1",
]

[build-system]
requires = ["uv_build>=0.11.25,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupytext>=1.19.6",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "ruff>=0.17.4",
]
