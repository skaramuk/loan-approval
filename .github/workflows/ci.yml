name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Check for backend project
        id: project
        run: |
          if [ -f pyproject.toml ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - uses: astral-sh/setup-uv@v10.3.3 # setup-uv publishes only full version tags
        if: steps.project.outputs.exists == 'true'
      - name: Install
        if: steps.project.outputs.exists == 'true'
        run: uv sync --locked
      - name: Lint
        if: steps.project.outputs.exists == 'true'
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test
        if: steps.project.outputs.exists == 'true'
        run: uv run pytest
      - name: Build Docker image
        if: steps.project.outputs.exists == 'true' && hashFiles('backend/Dockerfile') != ''
        run: docker build -t loan-approval-backend .
      - name: Smoke test Docker image
        if: steps.project.outputs.exists == 'true' && hashFiles('backend/Dockerfile') != ''
        run: |
          docker run -d --name api -p 8000:8000 \
            -e SUPABASE_URL=https://example.supabase.co loan-approval-backend
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health | grep -q '"model_loaded":true'
          curl -fsS http://127.0.0.1:8000/api/v1/model | grep -q '"model_version":"1.0.0"'
          # Predictions require a signed-in user: without a token the API must answer 401.
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://127.0.0.1:8000/api/v1/predictions -H 'Content-Type: application/json' -d '{}')
          test "$status" = "401"
      - name: Show container logs
        if: failure()
        run: docker logs api || true

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - name: Check for frontend project
        id: project
        run: |
          if [ -f package.json ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v7
        if: steps.project.outputs.exists == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        if: steps.project.outputs.exists == 'true'
        run: npm ci
      - name: Lint
        if: steps.project.outputs.exists == 'true'
        run: npm run lint
      - name: Type check
        if: steps.project.outputs.exists == 'true'
        # Route types (PageProps, LayoutProps) are generated, not committed.
        run: npm run typecheck
      - name: Build
        if: steps.project.outputs.exists == 'true'
        run: npm run build
        env:
          # Public placeholders: the build only needs the variables to exist.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
          NEXT_PUBLIC_API_URL: http://localhost:8000
