name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Check for backend project
        id: project
        run: |
          if [ -f pyproject.toml ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - uses: astral-sh/setup-uv@v6
        if: steps.project.outputs.exists == 'true'
      - name: Install
        if: steps.project.outputs.exists == 'true'
        run: uv sync --locked
      - name: Lint
        if: steps.project.outputs.exists == 'true'
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test
        if: steps.project.outputs.exists == 'true'
        run: uv run pytest
      - name: Build Docker image
        if: steps.project.outputs.exists == 'true' && hashFiles('backend/Dockerfile') != ''
        run: docker build -t loan-approval-backend .
      - name: Smoke test Docker image
        if: steps.project.outputs.exists == 'true' && hashFiles('backend/Dockerfile') != ''
        run: |
          docker run -d --name api -p 8000:8000 loan-approval-backend
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health | grep -q '"model_loaded":true'
          curl -fsS -X POST http://127.0.0.1:8000/api/v1/predictions \
            -H 'Content-Type: application/json' \
            -d '{"person_age":28,"person_education":"Bachelor","person_income":60000,"person_emp_exp":5,"person_home_ownership":"RENT","loan_amnt":12000,"loan_intent":"PERSONAL","loan_int_rate":12.5,"cb_person_cred_hist_length":6,"credit_score":640,"previous_loan_defaults_on_file":false}' \
            | grep -q '"model_version":"1.0.0"'
      - name: Show container logs
        if: failure()
        run: docker logs api || true

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Check for frontend project
        id: project
        run: |
          if [ -f package.json ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.project.outputs.exists == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        if: steps.project.outputs.exists == 'true'
        run: npm ci
      - name: Lint
        if: steps.project.outputs.exists == 'true'
        run: npm run lint
      - name: Type check
        if: steps.project.outputs.exists == 'true'
        run: npx tsc --noEmit
      - name: Build
        if: steps.project.outputs.exists == 'true'
        run: npm run build
